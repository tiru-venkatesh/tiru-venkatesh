<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="I build web apps, backend systems, and AI-powered products: LLMs, agents, computer vision, and the engineering that turns ideas into useful software. Building OPAI, an operating-agent project exploring AI assistance, tools, and workflows. Learning LLMs, RAG, AI agents, and Generative AI by shipping. Building end to end: frontend, backend, APIs, cloud. Sharing the journey as Tiru Builds and @lockintiru. Understand the problem, build a working version, test it, learn from what breaks, improve it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
